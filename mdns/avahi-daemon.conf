# Avahi για container (χωρίς D-Bus). Το host-name ΔΕΝ ορίζεται εδώ:
# by default χρησιμοποιείται το hostname του Linux server.
# Για σταθερό όνομα βάλε MDNS_HOSTNAME στο .env.
[server]
use-ipv4=yes
use-ipv6=no
enable-dbus=no
ratelimit-interval-usec=1000000
ratelimit-burst=1000

[wide-area]
enable-wide-area=no

[publish]
publish-addresses=yes
publish-hinfo=no
publish-workstation=no
publish-aaaa-on-ipv4=no

[reflector]
enable-reflector=no
