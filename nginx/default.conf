# Docker embedded DNS -> resolve upstreams κατά το request (όχι στην εκκίνηση).
# Έτσι ο proxy δεν κρασάρει αν κάποιο service κάνει restart.
resolver 127.0.0.11 valid=30s ipv6=off;

# ------------------------------------------------------------------
# Plug-and-play: ΚΑΝΕΝΑ hardcoded όνομα. Κάθε server block δέχεται
# οποιοδήποτε host (server_name _), ώστε η εφαρμογή να δουλεύει με
# <hostname>.local (mDNS), με την IP του server ή με localhost.
# Οι υπηρεσίες ξεχωρίζουν με τη θύρα:
#   :80   -> Διαχειριστικό (Vue, + /api μέσα από το frontend)
#   :3000 -> Grafana
#   :8080 -> Adminer
# ------------------------------------------------------------------

# :80 -> Vue admin (+ /api proxy μέσα στο frontend)
server {
    listen 80 default_server;
    server_name _;
    client_max_body_size 100M;
    set $up_frontend frontend;

    # Desktop εφαρμογή (Electron): installer + αρχεία auto-update
    # (latest.yml, *.exe, *.blockmap) από το ${MEASURELOG_DATA_DIR}/desktop
    location ^~ /desktop/ {
        alias /usr/share/nginx/desktop/;
        add_header Cache-Control "no-cache";
    }

    location / {
        proxy_pass http://$up_frontend:80;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 300s;
    }
}

# :3000 -> Grafana
server {
    listen 3000 default_server;
    server_name _;
    set $up_grafana grafana;
    location / {
        proxy_pass http://$up_grafana:3000;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}

# :8080 -> Adminer
server {
    listen 8080 default_server;
    server_name _;
    set $up_adminer adminer;
    location / {
        proxy_pass http://$up_adminer:8080;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
}
