# Docker embedded DNS -> resolve upstreams κατά το request (όχι στην εκκίνηση).
# Έτσι ο proxy δεν κρασάρει αν κάποιο service κάνει restart.
resolver 127.0.0.11 valid=30s ipv6=off;

# admin.meteologger.local -> Vue admin (+ /api proxy μέσα στο frontend)
server {
    listen 80;
    server_name admin.meteologger.local;
    client_max_body_size 100M;
    set $up_frontend frontend;
    location / {
        proxy_pass http://$up_frontend:80;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 300s;
    }
}

# grafana.meteologger.local -> Grafana
server {
    listen 80;
    server_name grafana.meteologger.local;
    set $up_grafana grafana;
    location / {
        proxy_pass http://$up_grafana:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}

# adminer.meteologger.local -> Adminer
server {
    listen 80;
    server_name adminer.meteologger.local;
    set $up_adminer adminer;
    location / {
        proxy_pass http://$up_adminer:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
}

# default -> admin
server {
    listen 80 default_server;
    server_name _;
    return 302 http://admin.meteologger.local;
}
