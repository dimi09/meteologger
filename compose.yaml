services:
  db:
    image: postgres:15
    container_name: meteologger-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: ./backend
    container_name: meteologger-api
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      STORAGE_ROOT: /app/storage
      SECRET_KEY: ${SECRET_KEY}
      ADMIN_USERNAME: ${ADMIN_USERNAME}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}
      CORS_ORIGINS: ${CORS_ORIGINS}
    volumes:
      - ${MEASURELOG_DATA_DIR:-./storage}/uploads:/app/storage/uploads
      - ${MEASURELOG_DATA_DIR:-./storage}/imports:/app/storage/imports
      - ${MEASURELOG_DATA_DIR:-./storage}/exports:/app/storage/exports
      - ${MEASURELOG_DATA_DIR:-./storage}/backups:/app/storage/backups
    ports:
      - "8000:8000"   # Swagger dev: http://localhost:8000/docs (προαιρετικό)

  frontend:
    build:
      context: ./frontend
      args:
        VUE_APP_GRAFANA_URL: http://grafana.meteologger.local/
    container_name: meteologger-frontend
    restart: unless-stopped
    depends_on:
      - api

  proxy:
    image: nginx:1.27-alpine
    container_name: meteologger-proxy
    restart: unless-stopped
    depends_on:
      - frontend
      - grafana
      - adminer
    ports:
      - "80:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro

  grafana:
    image: grafana/grafana:11.4.0
    container_name: meteologger-grafana
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD}
      # για ενσωμάτωση σε iframe μέσα στο admin
      GF_SECURITY_ALLOW_EMBEDDING: "true"
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_SERVER_ROOT_URL: http://grafana.meteologger.local/
      # για το provisioning του datasource
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning
      - ./grafana/dashboards:/var/lib/grafana/dashboards
    ports:
      - "3000:3000"   # προαιρετικό dev

  adminer:
    image: adminer
    container_name: meteologger-adminer
    restart: unless-stopped
    ports:
      - "8080:8080"   # προαιρετικό dev

  backup:
    build: ./backup
    container_name: meteologger-backup
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      BACKUP_HOUR: ${BACKUP_HOUR}
      BACKUP_MINUTE: ${BACKUP_MINUTE}
      BACKUP_RETENTION_DAYS: ${BACKUP_RETENTION_DAYS}
      BACKUP_ON_START: ${BACKUP_ON_START}
    volumes:
      - ${MEASURELOG_DATA_DIR:-./storage}/backups:/backups

volumes:
  pgdata:
  grafana_data:
