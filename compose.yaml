services:
  # --- mDNS: ανακοινώνει τον server στο LAN ως <hostname>.local ---
  # Plug-and-play: καμία IP, κανένα αρχείο hosts στους clients.
  # Χρειάζεται network_mode: host για να στέλνει multicast στο LAN (μόνο σε Linux server).
  mdns:
    build: ./mdns
    container_name: meteologger-mdns
    restart: unless-stopped
    network_mode: host
    environment:
      # κενό = χρήση του hostname του Linux server (προτείνεται)
      MDNS_HOSTNAME: ${MDNS_HOSTNAME:-}

  db:
    image: postgres:15
    container_name: meteologger-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: ./backend
    container_name: meteologger-api
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      STORAGE_ROOT: /app/storage
      SECRET_KEY: ${SECRET_KEY}
      ADMIN_USERNAME: ${ADMIN_USERNAME}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}
      CORS_ORIGINS: ${CORS_ORIGINS}
    volumes:
      - ${MEASURELOG_DATA_DIR:-./storage}/uploads:/app/storage/uploads
      - ${MEASURELOG_DATA_DIR:-./storage}/imports:/app/storage/imports
      - ${MEASURELOG_DATA_DIR:-./storage}/exports:/app/storage/exports
      - ${MEASURELOG_DATA_DIR:-./storage}/backups:/app/storage/backups
    ports:
      - "8000:8000"   # Swagger dev: http://localhost:8000/docs (προαιρετικό)

  frontend:
    # Το URL του Grafana υπολογίζεται στον browser (ίδιο host, θύρα 3000)
    build: ./frontend
    container_name: meteologger-frontend
    restart: unless-stopped
    depends_on:
      - api

  proxy:
    image: nginx:1.27-alpine
    container_name: meteologger-proxy
    restart: unless-stopped
    depends_on:
      - frontend
      - grafana
      - adminer
    ports:
      - "80:80"       # Διαχειριστικό
      - "3000:3000"   # Grafana
      - "8080:8080"   # Adminer
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ${MEASURELOG_DATA_DIR:-./storage}/desktop:/usr/share/nginx/desktop:ro

  grafana:
    image: grafana/grafana:11.4.0
    container_name: meteologger-grafana
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD}
      # για ενσωμάτωση σε iframe μέσα στο admin
      GF_SECURITY_ALLOW_EMBEDDING: "true"
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      # για το provisioning του datasource
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning
      - ./grafana/dashboards:/var/lib/grafana/dashboards
    # Χωρίς ports: εκτίθεται μέσω proxy στη :3000

  adminer:
    image: adminer
    container_name: meteologger-adminer
    restart: unless-stopped
    # Χωρίς ports: εκτίθεται μέσω proxy στη :8080

  backup:
    build: ./backup
    container_name: meteologger-backup
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      BACKUP_HOUR: ${BACKUP_HOUR}
      BACKUP_MINUTE: ${BACKUP_MINUTE}
      BACKUP_RETENTION_DAYS: ${BACKUP_RETENTION_DAYS}
      BACKUP_ON_START: ${BACKUP_ON_START}
    volumes:
      - ${MEASURELOG_DATA_DIR:-./storage}/backups:/backups

  # --- Build της desktop εφαρμογής (Windows installer) ---
  # Δεν τρέχει με το `up`. Χρήση (στον server, μετά από αλλαγή στο desktop/):
  #   docker compose --profile desktop run --rm desktop-build
  # Το αποτέλεσμα μπαίνει στο ${MEASURELOG_DATA_DIR}/desktop και οι χρήστες
  # βλέπουν αυτόματα την ενημέρωση (αν αυξήθηκε το version στο desktop/package.json).
  desktop-build:
    image: electronuserland/builder:wine
    profiles: ["desktop"]
    working_dir: /project
    volumes:
      - ./desktop:/project
      - desktop_node_modules:/project/node_modules
      - ${MEASURELOG_DATA_DIR:-./storage}/desktop:/out
    command:
      - bash
      - -c
      - >-
        npm ci &&
        npx electron-builder --win nsis --publish never -c.directories.output=/tmp/dist &&
        cp /tmp/dist/*.exe /tmp/dist/*.blockmap /out/ &&
        cp /tmp/dist/latest.yml /out/latest.yml &&
        echo "OK: $$(grep '^version' /out/latest.yml)" && ls -la /out

volumes:
  pgdata:
  grafana_data:
  desktop_node_modules:
