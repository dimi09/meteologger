<!DOCTYPE html>
<html lang="el">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1.0" />
    <!-- Εφαρμογή σκοτεινού θέματος πριν φορτώσει η εφαρμογή (χωρίς "λευκό φλας") -->
    <script>
      (function () {
        try {
          var m = localStorage.getItem("ml_theme") || "system";
          var d = m === "dark" || (m === "system" && window.matchMedia &&
                  window.matchMedia("(prefers-color-scheme: dark)").matches);
          if (d) { document.documentElement.classList.add("dark"); document.documentElement.style.colorScheme = "dark"; }
        } catch (e) {}
      })();
    </script>
    <title>MeteoLogger — Διαχειριστικό</title>
  </head>
  <body>
    <noscript>Απαιτείται JavaScript για την εκτέλεση της εφαρμογής.</noscript>
    <div id="app"></div>
  </body>
</html>
